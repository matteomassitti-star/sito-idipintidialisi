name: Import current production snapshot

on:
  push:
    branches:
      - agent/sync-production-source

permissions:
  contents: write

jobs:
  import-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import current public production files
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.idipintidialisi.com"

          fetch() {
            local remote="$1"
            local local_path="$2"
            mkdir -p "$(dirname "$local_path")"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$BASE/$remote" -o "$local_path"
          }

          fetch "" "index.html"
          fetch "admin" "admin/index.html"

          for f in \
            privacy.html \
            cookie-policy.html \
            google418cfa9d7a79cb96.html \
            robots.txt \
            sitemap.xml \
            site.webmanifest \
            android-chrome-192x192.png \
            android-chrome-512x512.png \
            apple-touch-icon.png \
            favicon-16x16.png \
            favicon-32x32.png \
            favicon.ico \
            logo-alisi.png
          do
            fetch "$f" "$f"
          done

          mkdir -p opere
          for i in $(seq 0 66); do fetch "opere/t${i}.jpg" "opere/t${i}.jpg"; done
          for i in $(seq 0 64); do fetch "opere/w${i}.jpg" "opere/w${i}.jpg"; done
          fetch "opere/il-polpo-che-e-in-me.jpg" "opere/il-polpo-che-e-in-me.jpg"
          fetch "opere/picchiopinocchio.jpg" "opere/picchiopinocchio.jpg"

          mkdir -p content/home
          if ! curl --fail --location --silent --show-error --retry 2 "$BASE/content/home/index.json" -o content/home/index.json; then
            rm -f content/home/index.json
          fi

          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  { "key": "X-Content-Type-Options", "value": "nosniff" },
                  { "key": "Referrer-Policy", "value": "strict-origin-when-cross-origin" },
                  { "key": "Permissions-Policy", "value": "camera=(), microphone=(), geolocation=()" },
                  { "key": "X-Frame-Options", "value": "SAMEORIGIN" }
                ]
              },
              {
                "source": "/admin/(.*)",
                "headers": [
                  { "key": "X-Robots-Tag", "value": "noindex, nofollow, noarchive" }
                ]
              },
              {
                "source": "/api/(.*)",
                "headers": [
                  { "key": "X-Robots-Tag", "value": "noindex, nofollow" }
                ]
              }
            ]
          }
          JSON

          rm -f site-text.tar.gz site-text.part-* site64.part-* README-GITHUB-SYNC.md sito.html
          rm -f .github/workflows/import-production.yml

          test -s index.html
          test -s admin/index.html
          test -s api/contact.js
          test -s opere/t0.jpg
          test -s opere/t66.jpg
          test -s opere/w64.jpg

      - name: Commit imported snapshot to test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Import live production snapshot"
          git push origin HEAD:${GITHUB_REF_NAME}
